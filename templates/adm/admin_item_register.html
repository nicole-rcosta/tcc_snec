<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/adm/admin_item_register.css">
    <link rel="stylesheet" href="../static/styles/variables.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Cadastrar Itens na Página Admin</title>
</head>

<body class="admin-panel">

    <header class="admin-painel__header">
        <h1 class="admin-painel__header--title">Administração</h1>
    </header>

    <main class="admin-panel__main">
        <section class="admin-panel__greeting">
            <h1 class="admin-panel__user-title">Olá, Lorem Ipsum!</h1>
            <h2 class="admin-panel__title">Cadastrar Itens:</h2>
        </section>

        <section class="admin-panel__menu">
            <hr class="admin-panel__divider" aria-hidden="true">

            <div class="admin-panel__grid">
                <div class="admin-panel__item">
                    <a href="">
                        <button type="button" class="admin-panel__button admin-panel__button--rooms">
                            <span class="admin-panel__button-text">Salas</span>
                        </button>
                    </a>
                </div>

                <div class="admin-panel__item">
                    <a href="">
                        <button type="button" class="admin-panel__button admin-panel__button--activities">
                            <span class="admin-panel__button-text">Atividade-Extracurricular</span>
                        </button>
                    </a>
                </div>

                <div class="admin-panel__item">
                    <a href="">
                        <button type="button" class="admin-panel__button admin-panel__button--students">
                            <span class="admin-panel__button-text">Alunos</span>
                        </button>
                    </a>
                </div>
            </div>

            <hr class="admin-panel__divider" aria-hidden="true">

            <a href="">
                <button type="button" class="admin-panel__button admin-panel__button--access">
                    <span class="admin-panel__button-text">Controle de Acesso</span>
                </button>
            </a>
        </section>
    </main>

</body>

</html>
