{% extends "layout.html" %}

<!-- Cor da barra (azul para professor, nutri para verde, adm para laranja) -->
{% set page_type = 'adm' %}

<!-- Título que vai aparecer dentro da barra azul -->
{% block page_title %}Administração{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='styles/adm/admin_register.css') }}">  


    <main class="admin-register">
        <i class="fa-solid fa-arrow-right-from-bracket recover-password__back-button admin-register__back-button"></i>

        <h2 class="admin-register__greeting">Olá, Administrador!</h2>

        <form class="admin-register__form" action="/adm_register/post" method="POST">

            <div class="admin-register__field--name">
                <label class="admin-register__label--name" for="name">Nome:</label>
                <input class="admin-register__input--name" type="text" id="name" name="name" required>
            </div>

            <div class="admin-register__field--email">
                <label class="admin-register__label--email" for="email">E-mail:</label>
                <input class="admin-register__input--email" type="email" id="email" name="email" required>
            </div>

            <div class="admin-register__field--cpf">
                <label class="admin-register__label--cpf" for="cpf">CPF:</label>
                <input class="admin-register__input--cpf" type="text" id="cpf" name="cpf" required>
                <!-- campo oculto -->
                <input type="hidden" name="cpf-real" id="cpf-real">
            </div>

            <h2 class="admin-register__greeting--password">Nova senha</h2>

            <div class="admin-register__field--password">
                <label class="admin-register__label--password" for="password">Senha:</label>
                <input class="admin-register__input--password" type="password" id="password" name="password" required>
            </div>

            <div class="admin-register__field--confirm-password">
                <label class="admin-register__label--confirm-password" for="confirm-password">Confirmar Senha:</label>
                <input class="admin-register__input--confirm-password" type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <div class="admin-register__actions">
                <button class="admin-register__button--submit" type="submit">Cadastrar</button>
            </div>

        </form>
    </main>
    <script>
    // Função que recebe um valor e aplica a máscara visual do CPF
    function mascaraCPF(valor) {
        return valor
            .replace(/\D/g, '')                    // tira o que não é numero
            .slice(0, 11)                          // máximo de 11 números
            .replace(/(\d{3})(\d)/, '$1.$2')       // ponto após o 3 numero
            .replace(/(\d{3})(\d)/, '$1.$2')       // ponto após o 6 numero
            .replace(/(\d{3})(\d{1,2})$/, '$1-$2');// traço antes dos últimos 2 numero
    }

   
    const inputVisual = document.getElementById('cpf');
    const inputReal = document.getElementById('cpf-real');

    // Adiciona um ouvinte que dispara toda vez que o usuário digita algo
    inputVisual.addEventListener('input', (e) => {
        
        const valorDigitado = e.target.value;
        
        // coloca a mascara no visual
        e.target.value = mascaraCPF(valorDigitado);
        
        // tira tudo ponto e traço do valor digitado e guarda no input oculto (para envio)
        inputReal.value = valorDigitado.replace(/\D/g, '');
    });
    </script>


{% endblock %}
