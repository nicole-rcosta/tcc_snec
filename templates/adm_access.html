<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração: Controle de Acesso</title>
    <link rel="stylesheet" href="../static/styles/adm_access.css">
    <script src="https://kit.fontawesome.com/29baadc06e.js" crossorigin="anonymous" defer></script>
</head>

<body class="admin-access">

    <header class="header header--admin">
        <h1 class="header__title">Administração</h1>
    </header>

    <main class="admin-access__main">
        <section class="admin-access__card-container">
            <h2 class="admin-access__main-title">Pedidos de Acesso</h2>

            <table class="admin-access__table">
                <thead class="admin-access__table-header">
                    <tr class="admin-access__table-row">
                        <th class="admin-access__table-cell admin-access__table-cell--code" scope="col">Código</th>
                        <th class="admin-access__table-cell admin-access__table-cell--name" scope="col">Nome</th>
                        <th class="admin-access__table-cell admin-access__table-cell--role" scope="col">Cargo</th>
                        <th class="admin-access__table-cell admin-access__table-cell--actions" scope="col">Permissão</th>
                    </tr>
                </thead>
                <tbody class="admin-access__table-body">
                    <tr class="admin-access__table-row">
                        <td class="admin-access__table-cell admin-access__table-cell--code" data-label="Código">7030</td>
                        <td class="admin-access__table-cell admin-access__table-cell--name" data-label="Nome">Fulano Silva</td>
                        <td class="admin-access__table-cell admin-access__table-cell--role" data-label="Cargo">Professor</td>
                        <td class="admin-access__table-cell admin-access__table-cell--actions" data-label="Permissão">
                            <div class="admin-access__action-buttons">
                                <button type="button" class="admin-access__button admin-access__button--approve"
                                    title="Aprovar pedido" aria-label="Aprovar pedido de Fulano Silva">
                                    <i class="fa-solid fa-check admin-access__button-icon" aria-hidden="true"></i>
                                    <span>Aprovar</span>
                                </button>
                                <button type="button" class="admin-access__button admin-access__button--reject"
                                    title="Rejeitar pedido" aria-label="Rejeitar pedido de Fulano Silva">
                                    <i class="fa-solid fa-xmark admin-access__button-icon" aria-hidden="true"></i>
                                    <span>Rejeitar</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

</body>

</html>
