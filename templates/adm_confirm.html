<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração: Controle de Acesso</title>
    <link rel="stylesheet" href="../static/styles/adm_confirm.css">
    <script src="https://kit.fontawesome.com/29baadc06e.js" crossorigin="anonymous" defer></script>
</head>

<body class="admin">

    <header class="admin-header">
        <h1 class="admin-header__title">Administração</h1>
    </header>

    <main class="admin-main">
        <section class="admin-card">
            <h2 class="admin-card__title">Confirme que você é o administrador:</h2>

            <form action="" method="POST" class="admin-card__form">
                <div class="admin-card__field">
                    <label for="admin-password" class="admin-card__label">Insira a sua senha:</label>
                    <input type="password" id="admin-password" name="password" class="admin-card__input"
                        placeholder="••••••••" required>
                </div>

                <div class="admin-card__actions">
                    <button type="submit" class="admin-card__button">Confirmar</button>
                </div>
            </form>
        </section>
    </main>

</body>

</html>
