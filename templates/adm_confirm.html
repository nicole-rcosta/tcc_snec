<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração: Controle de Acesso</title>
</head>

<body>

    <header class="admin-class__header">
        <h1 class="admin-class__header--title">Administração</h1>
    </header>

    <section class="admin-confirm">
        <h2 class="admin-confirm__title">Confirme que você é o administrador:</h2>
        <form action="" class="admin-confirm__actions">
            <div class="admin-confirm__field--password">
                <label class="admin-confirm__label--password">Insira a sua senha:</label>
                <input type="text" class="admin-confirm__input--password">
            </div>
            <button type="submit" class="admin-confirm__button--submit">Confirmar</button>
        </form>
    </section>

    <script src="https://kit.fontawesome.com/29baadc06e.js" crossorigin="anonymous"></script>

</html>
