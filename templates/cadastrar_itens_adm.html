<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles/cadastrar_itens_adm.css">
    <link rel="stylesheet" href="../static/styles/variables.css">
    <title>Cadastrar Itens na Página Admin</title>
</head>
<body>
    <main class="admin-panel">
        <section class="admin-panel__greeting">
            <h1>Olá, Lorem Ipsum!</h1>
            <h2 class="admin-panel__title">Cadastrar Itens:</h2>
        </section>

        <section class="admin-panel__menu">
            <hr class="admin-panel__divider">

            <button class="admin-panel__button--rooms">
                <span>Salas</span>
                <small>Cadastrar</small>
            </button>

            <hr class="admin-panel__divider">

            <button class="admin-panel__button--activities">
                <span>Atividades-Extracurricular</span>
                <small>Cadastrar</small>
            </button>

            <hr class="admin-panel__divider">

            <button class="admin-panel__button--students">
                <span>Alunos</span>
                <small>Cadastrar</small>
            </button>

            <hr class="admin-panel__divider">

            <button class="admin-panel__button--access">
                <span>Controle de Acesso</span>
                <small>Cadastrar</small>
            </button>
        </section>

    </main>
</body>
</html>
