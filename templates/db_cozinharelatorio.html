<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoard da Cozinha - Almoço</title>

    <link rel="stylesheet" href="../static/styles/db_cozinharelatorio.css">
</head>
<body class="dahsboard">
    <header>
        <h1 class="dashboard__header-title">DashBoard da Cozinha</h1>
    </header>
    <main>
        <section class="dashboard__total-card">
            <h2 class="dashboard__total-label">Total do almoço do dia:</h2>
            <p class="dashboard__total-number">20</p>
        </section>
        <section class="dashboard__list-section">
            <h2 class="dashboard__list-title">Lista de Nomes</h2>
            <table class="dashboard__table">
                <thead class="dashboard__table-header">
                    <tr class="dashboard__table-row">
                        <th class="dashboard__table-cell--rm">RM</th>
                        <th class="dashboard__table-cell--student">Aluno</th>
                        <th class="dashboard__table-cell--year">Ano</th>
                        <th class="dashboard__table-cell--activity">Atividade</th>
                    </tr>
                </thead>
                <tbody class="dashboard__table-body">
                    <tr class="dashboard__table-row">
                        <td class="dashboard__table-cell--rm">7050</td>
                        <td class="dashboard__table-cell--student">Fulano</td>
                        <td class="dashboard__table-cell--year">3°C</td>
                        <td class="dashboard__table-cell--activity">Comitê</td>
                    </tr>
                </tbody>
                <tfoot class="dashboard__table-footer">
                    <tr class="dashboard__table-row">
                        <td colspan="4">Data Referente ao dia</td>
                    </tr>
                </tfoot>
            </table>
        </section>
    </main>
</body>
</html>
