<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../static/styles/global.css">
    <link rel="stylesheet" href="../static/styles/variables.css">
    <link rel="stylesheet" href="../static/styles/layout.css">

{% endblock %}
</head>
<body>


    <header class="app-header">
        <a href="/login" class="header-logo">
            <img src="../static/img/logo_snec.png" alt="Logo">
        </a>

    <div class="header-actions">
        <!-- Botão Tema -->
        <button type="button" id="themeToggleBtn" class="header-btn btn-theme" title="Alternar tema">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>

        <!-- Botão Sair -->
        <a href="/logout" class="header-btn btn-logout" title="Sair">
            <i class="fa-solid fa-arrow-right-from-bracket fa-flip-horizontal"></i>
        </a>
    </div>

    <script src="../static/js/tema.js"></script>
    </header>


    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

{% endblock %}
</body>
</html>
