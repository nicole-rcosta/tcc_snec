<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEC</title>

    <script>
      document.documentElement.setAttribute('data-theme', localStorage.getItem('app-theme') || 'light');
      document.documentElement.style.colorScheme = localStorage.getItem('app-theme') || 'light';
    </script>

    <link rel="icon" href="/static/img/icone.ico" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/alerts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/layout.css') }}">

    {% block extra_css %}{% endblock %}

</head>
<body>


    <header class="app-header">
        <a href="/logout" class="header-logo">
            <img src="{{ url_for('static', filename='img/logo_snec.png') }}" alt="Logo SNEC">
        </a>

    <div class="header-actions">
        <!-- Botão Tema -->
        <button type="button" id="themeToggleBtn" class="header-btn btn-theme" title="Alternar tema">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>

        <!-- Botão Sair -->
        <a href="/logout" class="header-btn btn-logout" title="Sair">
            <i class="fa-solid fa-arrow-right-from-bracket fa-flip-horizontal"></i>
        </a>
    </div>

    
    </header>


    <!-- BARRA DE TÍTULO DE PONTA A PONTA -->
    <div class="page-top-bar {{ page_type | default('azul') }}">
        <h2>{% block page_title %}Título da Página{% endblock %}</h2>
    </div>


    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>


<script src="{{ url_for('static', filename='js/tema.js') }}"></script>


{% block extra_js %}{% endblock %}

</body>
</html>
