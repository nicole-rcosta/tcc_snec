<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/login/auth_login.css">
    <link rel="stylesheet" href="/static/styles/global.css">
    <title>Login</title>
</head>
<body>
        
        <img src="/static/img/fundo/canto_inf_dir.png" alt="" class="background-inf-dir background">
        <img src="/static/img/fundo/canto_inf_esq.png" alt="" class="background-inf-esq background">
        <img src="/static/img/fundo/canto_sup_dir.png" alt="" class="background-sup-dir background">
        <img src="/static/img/fundo/canto_sup_esq.png" alt="" class="background-sup-esq background">
        
        <form class="login--card" action="/login/post" method="POST">
            <img class="logo_snec" src="/static/img/logo_principal.png" alt="">

            <h1 class="login__title">Login</h1>

            {% if erro %}
            <span class="login__message-error">{{ erro }}</span>
            {% endif %}
        
            <div class="login-field">
                <label class="login__label" for="cpf">CPF</label>
                <input class="login__input" type="text" id="cpf" name="cpf">
            </div>
        
            <div class="login-field">
                <label class="login__label" for="password">Senha</label>
                <input class="login__input" type="password" id="password" name="password">
            </div>
        
            <button class="login__button--submit" type="submit">Entrar</button>
            <a class="login__link--forgot" href="/password_recover">Esqueci minha senha</a>
        </form>
            <a class="login__link--register" href="/cadastro">Ainda não tem conta? <strong>Cadastre-se</strong></a>

</body>
</html>
