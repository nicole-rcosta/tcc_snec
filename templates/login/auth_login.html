<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/styles/global.css">
    <link rel="stylesheet" href="/static/styles/login/auth_login.css">
    <link rel="stylesheet" href="/static/styles/global.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/alerts.css') }}">

    <link rel="icon" href="/static/img/icone.ico" type="image/x-icon">
    <title>SNEC | Login</title>
</head>
<body>
        
    <!-- Elementos decorativos nos cantos -->
    <img src="/static/img/fundo/canto_sup_esq-v2.png" alt="" class="background background-sup-esq">
    <img src="/static/img/fundo/canto_sup_dir-v2.png" alt="" class="background background-sup-dir">
    <img src="/static/img/fundo/canto_inf_esq-v2.png" alt="" class="background background-inf-esq">
    <img src="/static/img/fundo/canto_inf_dir-v2.png" alt="" class="background background-inf-dir">
    

            
    <main class="login-container">
        <form class="login--card" action="/login/post" method="POST">

            <div class="login__theme-toggle-container">
                <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Alternar tema">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
            
            <img class="logo_snec" src="/static/img/logo_principal.png" alt="Logo SNEC">

            <h1 class="login__title">Login</h1>

            {% if erro %}
            <span class="login__message-error">{{ erro }}</span>
            {% endif %}
        
            <div class="login-field">
                <label class="login__label" for="cpf">CPF</label>
                <div class="input-wrapper">
                    <input class="login__input" type="text" id="cpf" name="cpf" placeholder="Digite somente números" required>
                    <!-- campo oculto -->
                    <input type="hidden" name="cpf-real" id="cpf-real">
                </div>
            </div>
        
            <!-- Campo Senha -->
            <div class="login-field">
                <label class="login__label" for="password">Senha</label>
                <div class="input-wrapper">
                    <input class="login__input" type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    <button type="button" class="toggle-password" id="togglePasswordBtn">
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
                <a class="login__link--forgot" href="/password_recover">Esqueci minha senha</a>
            </div>
        
            <button class="login__button--submit" type="submit">Entrar</button>


            <a class="login__link--register" href="/cadastro">
                Ainda não tem conta? <strong>Cadastre-se</strong>
            </a>

        </form>
    </main>

    <script src="{{ url_for('static', filename='js/toggle_password.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
</body>
    <script>
    // Função que recebe um valor e aplica a máscara visual do CPF
    function mascaraCPF(valor) {
        return valor
            .replace(/\D/g, '')                    // tira o que não é numero
            .slice(0, 11)                          // máximo de 11 números
            .replace(/(\d{3})(\d)/, '$1.$2')       // ponto após o 3 numero
            .replace(/(\d{3})(\d)/, '$1.$2')       // ponto após o 6 numero
            .replace(/(\d{3})(\d{1,2})$/, '$1-$2');// traço antes dos últimos 2 numero
    }

   
    const inputVisual = document.getElementById('cpf');
    const inputReal = document.getElementById('cpf-real');

    // Adiciona um ouvinte que dispara toda vez que o usuário digita algo
    inputVisual.addEventListener('input', (e) => {
        
        const valorDigitado = e.target.value;
        
        // coloca a mascara no visual
        e.target.value = mascaraCPF(valorDigitado);
        
        // tira tudo ponto e traço do valor digitado e guarda no input oculto (para envio)
        inputReal.value = valorDigitado.replace(/\D/g, '');
    });
    </script>
</html>
