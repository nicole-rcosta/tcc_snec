<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/styles/global.css">
    <link rel="stylesheet" href="/static/styles/login/auth_login.css">
    <title>Login - SNEC</title>
</head>
<body>
        
    <!-- Elementos decorativos nos cantos -->
    <img src="/static/img/fundo/canto_sup_esq-v2.png" alt="" class="background background-sup-esq">
    <img src="/static/img/fundo/canto_sup_dir-v2.png" alt="" class="background background-sup-dir">
    <img src="/static/img/fundo/canto_inf_esq-v2.png" alt="" class="background background-inf-esq">
    <img src="/static/img/fundo/canto_inf_dir-v2.png" alt="" class="background background-inf-dir">
    
    <main class="login-container">
        <form class="login--card" action="/login/post" method="POST">
            
            <img class="logo_snec" src="/static/img/logo_principal.png" alt="Logo SNEC">

            <h1 class="login__title">Login</h1>
        
            <div class="login-field">
                <label class="login__label" for="cpf">CPF</label>
                <div class="input-wrapper">
                    <input class="login__input" type="text" id="cpf" name="cpf" placeholder="Digite somente números">
                </div>
            </div>
        
            <!-- Campo Senha -->
            <div class="login-field">
                <label class="login__label" for="password">Senha</label>
                <div class="input-wrapper">
                    <input class="login__input" type="password" id="password" name="password" placeholder="Digite sua senha">
                    <button type="button" class="toggle-password" id="togglePasswordBtn">
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
                <a class="login__link--forgot" href="/password_recover">Esqueci minha senha</a>
            </div>
        
            <button class="login__button--submit" type="submit">Entrar</button>


            <a class="login__link--register" href="/cadastro">
                Ainda não tem conta? <strong>Cadastre-se</strong>
            </a>

        </form>
    </main>

    <script src="{{ url_for('static', filename='js/toggle_password.js') }}"></script>
</body>
</html>
