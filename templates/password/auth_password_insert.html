<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/password/auth_password_insert.css">
    <link rel="stylesheet" href="/static/styles/global.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=move_item" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/static/js/insert-code.js" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/alerts.css') }}">

    <link rel="icon" href="/static/img/icone.ico" type="image/x-icon">
    <title>SNEC | Redefinição de Senha</title>
</head>

<body>
    <header class="insert-code__header">
        <a href="/login">
            <img class="logo_snec" src="/static/img/logo_principal.png" alt="">
        </a>
        
    </header>
    <main class="insert-code">

    <div class="insert-code__theme-toggle-container">
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Alternar tema">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <h1 class="insert-code__title">Recuperação de senha</h1>
    <h2 class="insert-code__subtitle">Insira o código recebido no email nos espaços abaixo</h2>

    <form class="insert-code__container" action="{{ url_for('verificar_codigo') }}" method="POST">

        <div class="insert-code__code-inputs">
            <input inputmode="numeric" type="text" maxlength="1" class="insert-code__input--digit" required autofocus />
            <input inputmode="numeric" type="text" maxlength="1" class="insert-code__input--digit" required />
            <input inputmode="numeric" type="text" maxlength="1" class="insert-code__input--digit" required />
            <input inputmode="numeric" type="text" maxlength="1" class="insert-code__input--digit" required />
            <input inputmode="numeric" type="text" maxlength="1" class="insert-code__input--digit" required />
        </div>

        <!-- Armazena os cinco dígitos juntos -->
        <input type="hidden" name="codigo-completo" id="codigo-completo">

        <div class="insert-code__actions">
            <a class="recover-password__link" href="{{ url_for('pagina_recuperar_senha') }}">Enviar código<br>novamente</a>
            <button class="insert-code__button--submit" type="submit">
                Enviar
            </button>
        </div>

    </form>
</main>

</body>
<script src="/static/js/alerts.js"></script>
<script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    {% if erro_codigo %}

    <script>
        mostrarAlerta(
            "Código incorreto",
            "error",
            "{{ url_for('pagina_recuperar_senha_codigo') }}",
            "Tentar novamente"
        );
    </script>

    {% elif codigo_expirado %}

    <script>
        mostrarAlerta(
            "Código expirado",
            "error",
            "{{ url_for('pagina_recuperar_senha') }}",
            "Solicitar novamente"
        );
    </script>

    {% endif %}
</html>
