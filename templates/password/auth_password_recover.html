<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/password/auth_password_recover.css">
    <link rel="stylesheet" href="/static/styles/global.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=move_item" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/alerts.css') }}">

    <link rel="icon" href="/static/img/icone.ico" type="image/x-icon">
    <title>SNEC | Redefinição de Senha</title>
</head>

<body>
    <header class="recover-password__header">
        <a href="/login">
            <img class="logo_snec" src="/static/img/logo_principal.png" alt="Logo">
        </a>
        
        <a href="/login"><i class="fa-solid fa-arrow-left-long insert-code__back-button"></i></a>
    </header>

    <main class="recover-password">

        <div class="recover-password__theme-toggle-container">
            <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Alternar tema">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
        <h1 class="recover-password__title">Recuperação de senha</h1>
        <h2 class="recover-password__subtitle">Insira seu e-mail cadastrado para receber o código de verificação</h2>

        <form action="{{ url_for('receber_email') }}" method="POST">
            <div class="recover-password__field">
                <label class="recover-password__label" for="email">E-MAIL</label>
                <input class="recover-password__input" type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="recover-password__actions">
                <button class="recover-password__button--submit" type="submit">Enviar</button>
            </div>
        </form>
    </main>
</body>

    <script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>

    {% if erro_email %}
    <script>
        mostrarAlerta(
            "O e-mail digitado não pertence à uma conta cadastrada",
            "error",
            "{{ url_for('pagina_recuperar_senha') }}",
            "Tentar novamente"
        );
    </script>
    {% endif %}
</html>
