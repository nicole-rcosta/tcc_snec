<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Senha</title>
    <script src="https://kit.fontawesome.com/29baadc06e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/styles/global.css">
    <link rel="stylesheet" href="/static/styles/password/auth_password_reset.css">
</head>
<body>
    <header class="reset-password__header">
        <img class="logo_snec" src="/static/img/logo_principal.png" alt="Logo">
        <a href="/password_recover/code"><i class="fa-solid fa-arrow-left-long reset-password__back-button"></i></a>
    </header>

    <main class="reset-password">
        <h1 class="reset-password__title">Recuperação de senha</h1>
        <h2 class="reset-password__subtitle">Redefina sua senha e em seguida faça o<br>login novamente</h2>

        <form class="reset-password__form" action="/password_recover/code/password_reset" method="POST">
            
            <div class="reset-password__field">
                <label class="reset-password__label" for="new-password">NOVA SENHA</label>
                <input class="reset-password__input" type="password" id="new-password" name="new-password" required>
            </div>

            <div class="reset-password__field">
                <label class="reset-password__label" for="confirm-password">CONFIRME A SENHA</label>
                <input class="reset-password__input" type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <div class="reset-password__actions">
                <button class="reset-password__button--submit" type="submit">Redefinir</button>
            </div>
            
        </form>
    </main>
</body>
    <script src="/static/js/alerts.js"></script>
    {% if senha_atualizada %}
    <script>
        mostrarAlerta(
            "Sua senha foi atualizada com sucesso!",
            "success"
        );
    </script>
    {% elif erro_senha %}
    <script>
        mostrarAlerta(
            "As senhas não correspondem",
            "error"
        );
    </script>
    {% endif %}
</html>
