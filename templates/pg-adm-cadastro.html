<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros Administração</title>
    <link rel="stylesheet" href="/static/styles/pg-adm-cadastro.css">
    <link rel="stylesheet" href="/static/styles/global.css">
    <script src="https://kit.fontawesome.com/29baadc06e.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="admin-register__header">
        <p>Administração</p>
    </header>
    <main class="admin-register">
        <i class="fa-solid fa-arrow-right-from-bracket fa-rotate-180 recover-password__back-button admin-register__back-button"></i>

        <h2 class="admin-register__greeting">
            Olá, Administrador!
        </h2>


        <form class="admin-register__form" action="" method="POST">

            <div class="admin-register__field--name">
                <label class="admin-register__label--name" for="name">
                    Nome:
                </label>

                <input
                    class="admin-register__input--name"
                    type="text"
                    id="name"
                    name="name"
                >
            </div>


            <div class="admin-register__field--email">
                <label class="admin-register__label--email" for="email">
                    E-mail
                </label>

                <input
                    class="admin-register__input--email"
                    type="email"
                    id="email"
                    name="email"
                >
            </div>


            <div class="admin-register__field--cpf">
                <label class="admin-register__label--cpf" for="cpf">
                    CPF
                </label>

                <input
                    class="admin-register__input--cpf"
                    type="text"
                    id="cpf"
                    name="cpf"
                >
            </div>


            <h2>Nova senha:</h2>


            <div class="admin-register__field--password">
                <label class="admin-register__label--password" for="password">
                    Senha:
                </label>

                <input
                    class="admin-register__input--password"
                    type="password"
                    id="password"
                    name="password"
                >
            </div>


            <div class="admin-register__field--confirm-password">
                <label class="admin-register__label--confirm-password" for="confirm-password">
                    Confirmar Senha:
                </label>

                <input
                    class="admin-register__input--confirm-password"
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                >
            </div>


            <div class="admin-register__actions">
                <button
                    class="admin-register__button--submit"
                    type="submit"
                >
                    Cadastrar
                </button>
            </div>

        </form>

    </main>
</body>
</html>
