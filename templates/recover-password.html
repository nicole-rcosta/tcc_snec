<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/recover-password.css">
    <link rel="stylesheet" href="/static/styles/global.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=move_item" />
    <title>Recuperação de Senha</title>
</head>

<body>
    <header class="recover-password__header">
        <img class="logo_snec" src="/static/img/logo_principal.png" alt="">
        <i class="fa-solid fa-arrow-right-from-bracket fa-rotate-180 recover-password__back-button"></i>
    </header>
    <div class="recover-password">
        <h1 class="recover-password__title">Recuperação de senha</h1>
        <h2 class="recover-password__subtitle">Insira seu email cadastrado para receber o código de verificação</h2>

        <form class="email-group" action="">
                <label class="recover-password__label--email">EMAIL</label>
                <input class="recover-password__input--email" type="text">
                <div class="recover-password__actions">
                    <a class="recover-password__link--resend" href="">Enviar código<br>novamente</a>
                    <button class="recover-password__button--submit" type="submit">Enviar</button>
                </div>
        </form>
    </div>
</body>
<script src="https://kit.fontawesome.com/29baadc06e.js" crossorigin="anonymous"></script>

</html>
