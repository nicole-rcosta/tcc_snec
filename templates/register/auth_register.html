<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/static/styles/register/auth_register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/global.css">

</head>
<body>
    <img src="/static/img/fundo/canto_inf_dir.png" alt="" class="background-inf-dir background">
    <img src="/static/img/fundo/canto_inf_esq.png" alt="" class="background-inf-esq background">
    <img src="/static/img/fundo/canto_sup_dir.png" alt="" class="background-sup-dir background">
    <img src="/static/img/fundo/canto_sup_esq.png" alt="" class="background-sup-esq background">

    <div class="register">


        <img class="logo_snec" src="/static/img/logo_snec.png" alt="">
        

        <h1 class="register__title">Cadastre-se</h1>

        <form action="cadastro/post" method="POST" class="register__form">

                <div class="register__field">
                    <label class="register__label" for="input-name">Nome Completo</label>
                    <input type="text" class="register__input" id="input-name" name="name">
                </div>
                <div class="register__field">
                    <label class="register__label" for="input-cpf">CPF</label>
                    <input type="text" class="register__input" id="input-cpf" name="cpf">
                </div>
                <div class="register__field">
                    <label class="register__label" for="input-email">E-mail</label>
                    <input type="text" class="register__input" id="input-email" name="email">
                </div>
                <div class="register__field">
                    <label class="register__label" for="input-password">Senha</label>
                    <input type="text" class="register__input" id="input-password" name="password">
                </div>

            <div class="register__field register__field--dropdown">
                <label class="register__label register__label--dropdown" for="select-register">Cargo</label>
                <select class="register__input register__input--dropdown" id="select-register">
                    <option value="selected">Selecione um cargo</option>
                    <option value="admin">Administrador(a)</option>
                    <option value="nutri">Nutricionista</option>
                    <option value="prof">Professor(a)</option>
                </select>
            </div>

            <button type="submit" class="register__button--submit">Cadastrar</button>
        </form>
        <a class="link--login" href="/login">Já tem conta? <strong>Entre</strong></a>
    </div>
    
</body>
<script src="https://kit.fontawesome.com/29baadc06e.js" crossorigin="anonymous"></script>
</html>
