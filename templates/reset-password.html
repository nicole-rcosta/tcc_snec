<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Senha</title>
    <script src="https://kit.fontawesome.com/29baadc06e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/styles/global.css">
    <link rel="stylesheet" href="/static/styles/reset-password.css">
</head>
<body>
    <header class="insert-code__header">
        <img class="logo_snec" src="/static/img/logo_principal.png" alt="Logo">
        <i class="fa-solid fa-arrow-left-long insert-code__back-button"></i>
    </header>

    <main class="insert-code">
        <h1 class="insert-code__title">Recuperação de senha</h1>
        <h2 class="insert-code__subtitle">Redefina sua senha e em seguida faça o<br>login novamente</h2>

        <form class="insert-code__container" action="">
            
            <div class="insert-code__field--new-password">
                <label class="insert-code__label--new-password" for="new-password">NOVA SENHA</label>
                <input class="insert-code__input--new-password" type="password" id="new-password" name="new-password" required>
            </div>

            <div class="insert-code__field--confirm-password">
                <label class="insert-code__label--confirm-password" for="confirm-password">CONFIRME A SENHA</label>
                <input class="insert-code__input--confirm-password" type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <div class="insert-code__actions">
                <button class="insert-code__button--reset" type="submit">Redefinir</button>
            </div>
            
        </form>
    </main>
</body>
</html>
