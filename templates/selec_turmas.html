<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles/selec_turmas.css">
    <link rel="stylesheet" href="../static/styles/variables.css">
    <title>Selecao de Turmas</title>
</head>

<body>
    <!-- Header Turmas -->
    <header class="header--classes">
        <p>Turmas</p>
    </header>

    <main class="classes-container">
        <section class="classes-status">
            <div class="classes__greeting-wrapper">
                <div class="classes__greting">
                    <p>Olá, Professor(a)!</p>
                </div>
            
                <button class="classes__logout-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                        class="classes__logout-button" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                        <path fill-rule="evenodd"
                            d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                    </svg>
                </button>
            </div>

            <!-- Barra de Progresso -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress--step-1"></div>
                </div>
                <p class="progress-label">Etapa 1 de 3</p>
            </div>
        </section>


        <!-- Grid de Cards -->
        <section class="classes-grid">
            <div class="class-card">
                <button class="class-card__title">3°A</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">1°A</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">2°B</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">3°C</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">3°B</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">2°A</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">1°C</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">1°B</button>
            </div>


        </section>
    </main>

</body>

</html>
