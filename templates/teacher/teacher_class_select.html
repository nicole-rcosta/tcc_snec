<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/teacher/teacher_class_select.css">
    <link rel="stylesheet" href="../static/styles/variables.css">
    <title>Seleção de Turmas</title>
</head>

<body>
    <!-- Header Turmas -->
    <header class="header--classes">
        <p>Turmas</p>
    </header>

    <main class="classes-container">
        <section class="classes-status">
            <div class="classes__greeting-wrapper">
                <div class="classes__greting">
                    <p>Olá, Professor(a)!</p>
                </div>
            
                
            </div>

            <!-- Barra de Progresso -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress--step-1"></div>
                </div>
                <p class="progress-label">Etapa 1 de 3</p>
            </div>
        </section>


        <!-- Grid de Cards -->
        <section class="classes-grid">
            <div class="class-card">
                <button class="class-card__title">3°A</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">1°A</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">2°B</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">3°C</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">3°B</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">2°A</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">1°C</button>
            </div>

            <div class="class-card">
                <button class="class-card__title">1°B</button>
            </div>


        </section>
    </main>

</body>

</html>
