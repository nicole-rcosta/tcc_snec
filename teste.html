<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Verificação SNEC</title>
    <style>
        /* Reset básico para e-mails */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        table { border-collapse: collapse !important; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #EBEBF5; }
        
        /* Estilos para Mobile */
        @media screen and (max-width: 600px) {
            .container { width: 100% !important; }
            .code-box { width: 90% !important; }
            .mobile-hide { display: none !important; }
            .mobile-padding { padding-left: 20px !important; padding-right: 20px !important; }
        }
    </style>
</head>
<body style="background-color: #EBEBF5; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif;">

    <!-- Tabela Principal de Fundo -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #EBEBF5;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                
                <!-- Container Central (Largura máxima de 600px) -->
                <table border="0" cellpadding="0" cellspacing="0" width="600" class="container" style="background-color: #EBEBF5; border-collapse: collapse; position: relative;">
                    
                    <!-- LINHA 1: Formas Decorativas Topo + Logo -->
                    <tr>
                        <td style="position: relative; padding-bottom: 30px;">
                            
                            <!-- Forma Verde (Topo Esquerdo) - SUBSTITUA A URL -->
                            <img src="https://via.placeholder.com/80x80/4CAF50/4CAF50?text=+" alt="" width="80" style="display: block; position: absolute; top: -10px; left: -10px; z-index: 1;">
                            
                            <!-- Forma Laranja (Topo Direito) - SUBSTITUA A URL -->
                            <img src="https://via.placeholder.com/100x100/FF7043/FF7043?text=+" alt="" width="100" style="display: block; position: absolute; top: -20px; right: -10px; z-index: 1;">

                            <!-- Logo SNEC - SUBSTITUA A URL -->
                            <div style="text-align: center; position: relative; z-index: 2; padding-top: 10px;">
                                <img src="https://via.placeholder.com/180x60/EBEBF5/4A4A8A?text=SNEC" alt="SNEC" width="180" style="display: inline-block;">
                            </div>
                        </td>
                    </tr>

                    <!-- LINHA 2: Texto de Instrução -->
                    <tr>
                        <td align="center" class="mobile-padding" style="padding: 0 40px 20px 40px;">
                            <h1 style="color: #4A4A8A; font-size: 22px; font-weight: bold; margin: 0; line-height: 1.4; text-align: center;">
                                O seu código de verificação<br>é:
                            </h1>
                        </td>
                    </tr>

                    <!-- LINHA 3: Caixa Branca com o Código -->
                    <tr>
                        <td align="center" style="padding: 0 20px 40px 20px;">
                            <!-- Tabela para criar a caixa branca arredondada -->
                            <table border="0" cellpadding="0" cellspacing="0" width="80%" class="code-box" style="background-color: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                                <tr>
                                    <td align="center" style="padding: 30px 20px;">
                                        <!-- O Código -->
                                        <span style="color: #FF7043; font-size: 48px; font-weight: bold; letter-spacing: 4px; font-family: Arial, Helvetica, sans-serif;">
                                            12345
                                        </span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- LINHA 4: Formas Decorativas Base (Opcional, mas recomendado para equilibrar) -->
                    <tr>
                        <td style="position: relative; height: 80px;">
                            <!-- Forma Amarela (Base Esquerda) - SUBSTITUA A URL -->
                            <img src="https://via.placeholder.com/90x90/FFD54F/FFD54F?text=+" alt="" width="90" style="display: block; position: absolute; bottom: -20px; left: -10px;">
                            
                            <!-- Forma Roxa (Base Direita) - SUBSTITUA A URL -->
                            <img src="https://via.placeholder.com/120x80/7E57C2/7E57C2?text=+" alt="" width="120" style="display: block; position: absolute; bottom: -10px; right: -10px;">
                        </td>
                    </tr>

                </table>
                <!-- Fim do Container Central -->

            </td>
        </tr>
    </table>

</body>
</html>
